[project]
name = "gehrman"
version = "0.1.0"
description = "CLI assistant that helps bug bounty researchers choose programs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andrew Lozinskyi" }]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "keyring>=25.0",
    "openai>=1.50",
    "pydantic>=2.0",
    "rich>=13.7",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.scripts]
gehrman = "gehrman.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit>=1.7",
    "cyclonedx-bom>=5.0",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
